name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format (Ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Check code formatting (Ruff)
        run: uvx ruff@0.17.1 format --check .

      - name: Check linter rules (Ruff)
        run: uvx ruff@0.17.1 check .

  test:
    name: Unit Tests (pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"
          enable-cache: true
          cache-suffix: "test-cpu-py310"

      - name: Install dependencies (CPU-only PyTorch)
        run: uv sync --locked --no-default-groups --group cpu --extra dev

      - name: Run unit tests (pytest)
        run: uv run --no-sync pytest tests/ -v
